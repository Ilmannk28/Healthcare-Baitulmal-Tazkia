<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peminjaman Kursi Roda / Pendaftaran Khitanan Massal</title>
    <link rel="stylesheet" href="../../scss/style.css">
    <link rel="stylesheet" href="../../scss/custom.css">
    <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Geocoder (Search Box) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <!-- Routing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />

    <style>
        body {
            background-color: #f8f9fa;
        }

        .map-trigger-card {
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .map-trigger-card:hover {
            transform: translateY(-2px);
            border-color: #f59e0b !important;
        }
    </style>
</head>

<body>
    <!-- Navbar Start -->
    <header id="header" class="border-bottom bg-white shadow-sm">
        <nav class="navbar navbar-expand-md py-3 px-4">
            <div class="container-fluid px-0">
                <!-- 1. Logo -->
                <a href="../index.html" class="navbar-brand me-0 col-auto col-md-2">
                    <img src="../../assets/img/logo.png" alt="Logo Baitulmal Tazkia" class="img-fluid"
                        style="max-height: 45px;">
                </a>

                <!-- 2. Burger Button (Mobile/Tablet) -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- 3. Collapsible Container -->
                <div class="collapse navbar-collapse justify-content-md-between mt-3 mt-md-0" id="navbarMain">

                    <!-- Nav Links -->
                    <ul class="nav flex-column flex-md-row col-md-auto mb-3 mb-md-0 text-start ms-md-4">
                        <li class="py-1 py-md-0">
                            <a href="../dashboard/layananKesehatan.html"
                                class="nav-link px-0 px-md-3 fw-bold link-secondary">Layanan Kesehatan</a>
                        </li>
                        <li class="py-1 py-md-0">
                            <a href="../dashboard/statusPemesanan.html"
                                class="nav-link px-0 px-md-3 fw-medium link-dark">Status Pemesanan</a>
                        </li>
                        <li class="py-1 py-md-0">
                            <a href="../about.html" class="nav-link px-0 px-md-3 fw-medium link-dark">Tentang Kami</a>
                        </li>
                    </ul>

                    <!-- Divider Khusus Mobile -->
                    <hr class="d-md-none text-muted my-2">

                    <!-- Auth Container -->
                    <div class="col-12 col-md-3 d-flex flex-column flex-md-row align-items-stretch align-items-md-center justify-content-end gap-2"
                        id="authNavButtons">
                        <div
                            class="d-flex align-items-center justify-content-between justify-content-md-end gap-3 w-100">
                            <span class="fw-semibold text-dark mb-0">Halo, <span id="userName">Rahayu</span>!</span>
                            <button type="button" class="btn btn-outline-danger btn-sm" id="btnLogout">Logout</button>
                        </div>
                    </div>

                </div>
            </div>
        </nav>
    </header>
    <!-- Navbar End -->

    <!-- Main Start -->
    <main>
        <div class="container py-4 my-2 my-md-4">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-10 col-xl-9">

                    <h1 class="text-center text-primary fw-bold mb-4 fs-3 fs-md-2">Form Pendaftaran Khitanan Massal</h1>

                    <form id="serviceForm" class="bg-primary rounded-4 p-3 p-sm-4 p-md-5 text-white shadow"
                        enctype="multipart/form-data">
                        <input type="hidden" name="khitan_event_id" value="">

                        <!-- Row 1: Nama Peserta & Nama Orang Tua -->
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label for="nama_pasien" class="form-label small fw-semibold">Nama Peserta</label>
                                <input type="text" class="form-control" id="nama_pasien" name="patient_name"
                                    placeholder="Masukkan nama lengkap peserta" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="parent_name" class="form-label small fw-semibold">Nama Orang Tua /
                                    Wali</label>
                                <input type="text" class="form-control" id="parent_name" name="parent_name"
                                    placeholder="Masukkan nama orang tua / wali" required>
                            </div>
                        </div>

                        <!-- Row 2: No Telp & Tanggal Lahir -->
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label for="nomor_telpon" class="form-label small fw-semibold">Nomor Telepon /
                                    WhatsApp</label>
                                <input type="tel" class="form-control" id="nomor_telpon" name="phone"
                                    placeholder="Contoh: 08123456789" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="tanggal_lahir" class="form-label small fw-semibold">Tanggal Lahir
                                    Peserta</label>
                                <input type="date" class="form-control" id="tanggal_lahir" name="birth_date" required>
                            </div>
                        </div>

                        <!-- Row 3: Alamat Lengkap & Map Trigger -->
                        <div class="row g-3 mb-3">
                            <!-- Alamat Lengkap -->
                            <div class="col-12 col-md-8 col-lg-9">
                                <label for="alamat" class="form-label small fw-semibold">Alamat Domisili Lengkap</label>
                                <textarea class="form-control" id="alamat" name="address" rows="5"
                                    placeholder="Masukkan alamat lengkap atau pilih titik pada peta..."
                                    required></textarea>
                            </div>

                            <!-- Tombol Peta -->
                            <div class="col-12 col-md-4 col-lg-3 d-flex flex-column">
                                <label class="form-label small fw-semibold d-block">Pilih Pin Point</label>
                                <div class="bg-white rounded-3 p-3 text-center text-dark map-trigger-card border shadow-sm flex-grow-1 d-flex flex-column align-items-center justify-content-center"
                                    data-bs-toggle="modal" data-bs-target="#mapsModal" id="btnOpenMap"
                                    style="min-height: 100px;">
                                    <i class="bi bi-geo-alt-fill text-danger fs-3 mb-1"></i>
                                    <span class="fw-semibold small text-primary">Buka Peta</span>
                                    <small class="text-muted fs-8 d-block">Tentukan titik domisili</small>
                                </div>
                            </div>
                        </div>

                        <!-- Upload Berkas Row -->
                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-12">
                                <label for="ktp" class="form-label small fw-semibold">Foto KTP Orang Tua / Wali</label>
                                <input class="form-control" id="ktp" name="ktp" type="file" accept="image/*,.pdf"
                                    required>
                            </div>
                            <div class="col-12 col-md-12">
                                <label for="kk" class="form-label small fw-semibold">Foto Kartu Keluarga (KK)</label>
                                <input class="form-control" id="kk" name="kk" type="file" accept="image/*,.pdf"
                                    required>
                            </div>
                            <div class="col-12 col-md-12">
                                <label for="sktm" class="form-label small fw-semibold">Surat Keterangan Tidak Mampu (SKTM)</label>
                                <input class="form-control" id="sktm" name="sktm" type="file" accept="image/*,.pdf"
                                    required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="mt-4">
                            <button type="submit"
                                class="btn btn-secondary btn-lg fw-bold text-primary w-100 shadow-sm py-2">
                                Ajukan Pendaftaran Khitanan
                            </button>
                        </div>
                    </form>

                </div>
            </div>

            <!-- Modal Maps Start -->
            <div class="modal fade" id="mapsModal" tabindex="-1" aria-labelledby="mapsModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-primary text-white">
                            <h5 class="modal-title fs-6" id="mapsModalLabel">
                                <i class="bi bi-map me-2"></i>Pilih Lokasi Domisili
                            </h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                aria-label="Close"></button>
                        </div>
                        <div class="modal-body p-0 position-relative">
                            <!-- Kontainer Peta -->
                            <div id="map" style="height: 380px; width: 100%;"></div>
                        </div>
                        <div class="modal-footer d-flex justify-content-between bg-light">
                            <small class="text-muted">
                                <i class="bi bi-info-circle me-1"></i>Klik lokasi pada peta atau geser pin marker.
                            </small>
                            <button type="button" class="btn btn-primary btn-sm px-4 fw-semibold"
                                data-bs-dismiss="modal">
                                Simpan Lokasi
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Modal Maps End -->

        </div>
    </main>
    <!-- Main End -->

    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.min.js"></script>

    <script>
        let map, marker;
        const alamatTextarea = document.getElementById('alamat');
        const mapsModal = document.getElementById('mapsModal');
        const openMapBtn = document.getElementById('btnOpenMap');

        mapsModal.addEventListener('shown.bs.modal', () => {
            const initialCoords = [-6.568144, 106.8440649]; // lat, lng

            if (!map) {
                // INIT MAP
                map = L.map('map', {
                    zoomControl: false
                }).setView(initialCoords, 13);

                // TILE MAP
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);

                // Zoom control di kanan bawah
                L.control.zoom({ position: 'bottomright' }).addTo(map);

                // Custom Marker Icon
                const customIcon = L.icon({
                    iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
                    iconSize: [36, 36],
                    iconAnchor: [18, 36]
                });

                marker = L.marker(initialCoords, {
                    draggable: true,
                    icon: customIcon
                }).addTo(map);

                // Drag Marker
                marker.on('dragend', () => {
                    const pos = marker.getLatLng();
                    reverseGeocode(pos.lat, pos.lng);
                });

                // Klik Map
                map.on('click', (e) => {
                    const { lat, lng } = e.latlng;
                    marker.setLatLng([lat, lng]);
                    reverseGeocode(lat, lng);
                });

                // Search Box Geocoder
                L.Control.geocoder({
                    defaultMarkGeocode: false
                })
                    .on('markgeocode', function (e) {
                        const latlng = e.geocode.center;
                        map.setView(latlng, 16);
                        marker.setLatLng(latlng);
                        alamatTextarea.value = e.geocode.name;
                    })
                    .addTo(map);

                // Auto Detect User Location
                map.locate({ setView: true, maxZoom: 16 });

                map.on('locationfound', function (e) {
                    marker.setLatLng(e.latlng);
                    reverseGeocode(e.latitude, e.longitude);
                });

            } else {
                map.invalidateSize();
            }
        });

        // Accessibility fix
        mapsModal.addEventListener('hidden.bs.modal', () => {
            setTimeout(() => {
                if (document.activeElement) document.activeElement.blur();
                if (openMapBtn) openMapBtn.focus();
            }, 50);
        });

        // Reverse Geocoding
        function reverseGeocode(lat, lng) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`)
                .then(res => res.json())
                .then(data => {
                    if (data.display_name) {
                        alamatTextarea.value = data.display_name;
                    }
                })
                .catch(() => {
                    alamatTextarea.value = `Koordinat: ${lat}, ${lng}`;
                });
        }
    </script>
    <script type="module" src="../../assets/js/forms/khitanForm.js"></script>
    <script type="module" src="../../assets/js/api/khitanApi.js"></script>
</body>

</html>
