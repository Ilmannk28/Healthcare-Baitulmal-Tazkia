<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Layanan</title>
    <link rel="stylesheet" href="../../scss/style.css">
    <link rel="stylesheet" href="../../scss/custom.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .sidebar {
            background-color: #0d2f6b;
            color: white;
        }

        .sidebar .nav-link {
            color: white;
            margin-bottom: 10px;
        }

        .sidebar .nav-link.active,
        .sidebar .nav-link:hover {
            background-color: #123d8d;
            border-radius: 8px;
        }

        .topbar {
            background-color: #0d2f6b;
            color: white;
            padding: 15px;
        }

        .btn-orange {
            background-color: #f59e0b;
            color: white;
            border: none;
        }

        .btn-orange:hover {
            background-color: #d97706;
        }

        .status-available {
            color: #0d6efd;
            font-weight: 500;
        }

        .status-unavailable {
            color: gray;
        }

        @media (min-width: 768px) {
            .sidebar {
                min-height: calc(100vh - 89px);
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header id="header" class="border-bottom bg-white shadow-sm">
        <nav class="navbar navbar-expand-md py-3 px-4">
            <div class="container-fluid px-0">
                <a href="../index.html" class="navbar-brand me-0">
                    <img src="../../assets/img/logo.png" alt="logo Baitulmal Tazkia" class="w-25">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-md-between" id="navbarMain">
                    <ul class="nav flex-column px flex-md-row col-md-auto mt-3 ms-3 justify-content-center mt-md-0 text-center text-md-start">
                        <li class="py-2 py-md-0 border-bottom border-md-0">
                            <a href="#" class="nav-link px-2 fw-bold active">Layanan Kesehatan</a>
                        </li>
                        <li class="py-2 py-md-0 border-bottom border-md-0">
                            <a href="statusPemesanan.html" class="nav-link px-2 fw-medium">Status Pemesanan</a>
                        </li>
                        <li class="py-2 py-md-0">
                            <a href="../about.html" class="nav-link px-2 fw-medium">Tentang Kami</a>
                        </li>
                    </ul>
                    <div class="col-md-3 d-flex flex-column flex-md-row justify-content-center justify-content-md-end gap-2 mt-3 mt-md-0 pb-2 pb-md-0"
                        id="authNavButtons">
                        <a href="../login.html" class="w-100 w-md-auto">
                            <button type="button" class="btn btn-outline-primary w-100">Login</button>
                        </a>
                        <a href="../register.html" class="w-100 w-md-auto">
                            <button type="button" class="btn btn-outline-secondary w-100">Sign-up</button>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Layout -->
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-12 col-md-3 sidebar p-3 p-md-4">
                <h5 class="mb-3 mb-md-4 d-none d-md-block">Daftar Layanan</h5>

                <ul class="nav flex-row flex-md-column overflow-auto flex-nowrap gap-2">
                    <li class="nav-item flex-shrink-0">
                        <a href="#" class="nav-link" id="ambulans" onclick="loadPage('ambulans')">
                            Ambulan Gratis
                        </a>
                    </li>
                    <li class="nav-item flex-shrink-0">
                        <a href="#" class="nav-link" id="kursi" onclick="loadPage('kursi')">
                            Kursi Roda
                        </a>
                    </li>
                    <li class="nav-item flex-shrink-0">
                        <a href="#" class="nav-link" id="khitan" onclick="loadPage('khitan')">
                            Khitanan Massal
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Content -->
            <div class="col-12 col-md-9 p-3 p-md-4">
                <div class="topbar rounded mb-3">
                    <h5 class="mb-0" id="title_dashboard">Daftar Pemesanan</h5>
                </div>
                <div id="app"></div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="modalEditLayanan" tabindex="-1" aria-labelledby="modalEditLayananLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalEditLayananLabel">Edit Data Permintaan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <form id="formEditLayanan">
                    <input type="hidden" id="editRequestId" name="request_id">
                    <input type="hidden" id="editServiceInput" name="service_name">

                    <div class="modal-body" id="containerFormDinamis">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- SPA Script -->
    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- ATAU kalau pakai CDN: -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


    <script src="../../assets/js/api.js"></script>
    <script type="module" src="../../assets/js/main.js"></script>

</body>

</html>
