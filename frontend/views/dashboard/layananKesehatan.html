<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Layanan</title>
    <link rel="stylesheet" href="../../scss/style.css">
    <link rel="stylesheet" href="../../scss/custom.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .sidebar {
            background-color: #0d2f6b;
            color: white;
        }

        .sidebar .nav-link {
            color: white;
            margin-bottom: 10px;
        }

        .sidebar .nav-link.active,
        .sidebar .nav-link:hover {
            background-color: #123d8d;
            border-radius: 8px;
        }

        .topbar {
            background-color: #0d2f6b;
            color: white;
            padding: 15px;
        }

        .btn-orange {
            background-color: #f59e0b;
            color: white;
            border: none;
        }

        .btn-orange:hover {
            background-color: #d97706;
        }

        .status-available {
            color: #0d6efd;
            font-weight: 500;
        }

        .status-unavailable {
            color: gray;
        }

        @media (min-width: 768px) {
            .sidebar {
                min-height: calc(100vh - 89px);
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header id="header" class="border-bottom bg-white shadow-sm">
        <nav class="navbar navbar-expand-md py-3 px-4">
            <div class="container-fluid px-0">
                <!-- 1. Logo (Menggunakan w-25 seperti about.html, namun dibatasi max-width agar konsisten) -->
                <a href="../index.html" class="navbar-brand me-0 col-auto col-md-2">
                    <img src="../../assets/img/logo.png" alt="Logo Baitulmal Tazkia" class="img-fluid"
                        style="max-height: 45px;">
                </a>

                <!-- 2. Burger Button (Mobile/Tablet) -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- 3. Collapsible Container -->
                <div class="collapse navbar-collapse justify-content-md-between mt-3 mt-md-0" id="navbarMain">

                    <!-- Nav Links:
                     - Mobile/Tablet: Rata kiri rapat tanpa margin ekstra
                     - Desktop (md+): Tambah 'ms-md-4' atau 'ms-md-5' untuk membuat GAP lega seperti about.html -->
                    <ul class="nav flex-column flex-md-row col-md-auto mb-3 mb-md-0 text-start ms-md-4">
                        <li class="py-1 py-md-0">
                            <a href="../dashboard/layananKesehatan.html"
                                class="nav-link px-0 px-md-3 fw-bold link-secondary">Layanan Kesehatan</a>
                        </li>
                        <li class="py-1 py-md-0">
                            <a href="../dashboard/statusPemesanan.html"
                                class="nav-link px-0 px-md-3 fw-medium link-dark">Status Pemesanan</a>
                        </li>
                        <li class="py-1 py-md-0">
                            <a href="../about.html" class="nav-link px-0 px-md-3 fw-medium link-dark">Tentang Kami</a>
                        </li>
                    </ul>

                    <!-- Divider Khusus Tampilan Mobile -->
                    <hr class="d-md-none text-muted my-2">


                    <div class="col-12 col-md-3 d-flex flex-column flex-md-row align-items-stretch align-items-md-center justify-content-end gap-2"
                        id="authNavButtons">

                        <div
                            class="d-flex align-items-center justify-content-between justify-content-md-end gap-3 w-100">
                            <span class="fw-semibold text-dark mb-0">Halo, <span id="userName">Rahayu</span>!</span>
                            <button type="button" class="btn btn-outline-danger btn-sm" id="btnLogout">Logout</button>
                        </div>

                    </div>

                </div>
            </div>
        </nav>
    </header>

    <!-- Main Layout -->
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-12 col-md-3 sidebar p-3 p-md-4">
                <h5 class="mb-3 mb-md-4 d-none d-md-block">Daftar Layanan</h5>

                <ul class="nav flex-row flex-md-column overflow-auto flex-nowrap gap-2">
                    <li class="nav-item flex-shrink-0">
                        <a href="#" class="nav-link" id="ambulans" onclick="loadPage('ambulans')">
                            Ambulan Gratis
                        </a>
                    </li>
                    <li class="nav-item flex-shrink-0">
                        <a href="#" class="nav-link" id="kursi" onclick="loadPage('kursi')">
                            Kursi Roda
                        </a>
                    </li>
                    <li class="nav-item flex-shrink-0">
                        <a href="#" class="nav-link" id="khitan" onclick="loadPage('khitan')">
                            Khitanan Massal
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Content -->
            <div class="col-12 col-md-9 p-3 p-md-4">
                <div class="topbar rounded mb-3">
                    <h5 class="mb-0" id="title_dashboard">Daftar Pemesanan</h5>
                </div>
                <div id="app"></div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="modalEditLayanan" tabindex="-1" aria-labelledby="modalEditLayananLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalEditLayananLabel">Edit Data Permintaan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <form id="formEditLayanan">
                    <input type="hidden" id="editRequestId" name="request_id">
                    <input type="hidden" id="editServiceInput" name="service_name">

                    <div class="modal-body" id="containerFormDinamis">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script type="module" src="../../assets/js/main.js"></script>

</body>

</html>
