<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../scss/style.css">
    <link rel="stylesheet" href="../scss/custom.css">
</head>

<body class="bg-primary">

    <div class="container py-4 py-md-5 min-vh-100 d-flex align-items-center justify-content-center">

        <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 500px;">

            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">

                    <img src="../assets/img/logo.png"
                        class="img-fluid"
                        style="max-width:80px;"
                        alt="Logo">

                    <h4 class="fw-bold text-primary mt-3">
                        Selamat Datang!
                    </h4>

                    <p class="text-muted small mb-0">
                        Silakan masuk ke akun Anda
                    </p>

                </div>

                <form id="loginForm" method="POST">

                    <div class="mb-3">

                        <label for="email" class="form-label fw-semibold">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Masukkan email Anda"
                            required>

                    </div>

                    <div class="mb-4">

                        <label for="password" class="form-label fw-semibold">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100 fw-semibold">

                        Login

                    </button>

                </form>

                <p class="text-center mt-4 mb-0">

                    Belum memiliki akun?

                    <a
                        href="register.html"
                        class="fw-bold text-decoration-none">

                        Daftar

                    </a>

                </p>

            </div>

        </div>

    </div>

    <script src="/frontend/assets/js/auth/login.js"></script>

</body>


</html>
