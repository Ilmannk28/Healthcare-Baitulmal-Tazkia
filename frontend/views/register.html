<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../scss/style.css">
    <link rel="stylesheet" href="../scss/custom.css">
</head>

<body class="bg-primary">

    <div class="container py-4 py-md-5 min-vh-100 d-flex align-items-center justify-content-center">

        <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 650px;">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <img src="../assets/img/logo.png" class="img-fluid" style="max-width:80px;" alt="Logo">

                    <h4 class="fw-bold text-primary mt-3">
                        Selamat Datang!
                    </h4>
                </div>

                <form id="registerForm">

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">
                            Nama Lengkap
                        </label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Masukkan nama Anda"
                            required>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="birth_date" class="form-label fw-semibold">
                                Tanggal Lahir
                            </label>

                            <input type="date" class="form-control" id="birth_date" name="birth_date" required>
                        </div>

                        <div class="col-md-6 mb-3">

                            <label for="gender" class="form-label fw-semibold">
                                Jenis Kelamin
                            </label>

                            <select class="form-select" id="gender" name="gender" required>

                                <option value="">Pilih Jenis Kelamin</option>
                                <option value="male">Laki-laki</option>
                                <option value="female">Perempuan</option>

                            </select>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label for="email" class="form-label fw-semibold">
                            Email
                        </label>

                        <input type="email" class="form-control" id="email" name="email" placeholder="Masukkan email"
                            required>

                    </div>

                    <div class="row">

                        <div class="col-lg-12 col-md-6 mb-3">

                            <label for="password" class="form-label fw-semibold">
                                Password
                            </label>

                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Password" required>

                        </div>

                        <div class="col-lg-12  col-md-6 mb-3">

                            <label for="confirm_password" class="form-label fw-semibold">
                                Konfirmasi Password
                            </label>

                            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                placeholder="Konfirmasi Password" required>

                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-2">

                        Daftar

                    </button>

                    <p class="text-center mt-4 mb-0">

                        Sudah memiliki akun?

                        <a href="login.html" class="fw-bold text-decoration-none">

                            Login

                        </a>

                    </p>

                </form>

            </div>
        </div>

    </div>

    <script type="module" src="../assets/js/auth/register.js"></script>

</body>

</html>
